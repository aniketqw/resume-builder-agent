# Role definitions drive both resume targeting and ATS scoring.
#
# `keywords` are what an ATS actually matches on. `weight` lets a role say that
# some terms matter more than others: a LangGraph agent role cares far more
# about "langgraph" than about "python", even though both are real signals.
# `required_sections` and `target_words` encode layout conventions, which are
# worth points because real screeners and parsers both depend on them.

defaults:
  required_sections: [summary, experience, projects, skills, education]
  target_words: [450, 850]
  action_verbs:
    - built, designed, implemented, shipped, led, architected, automated
    - migrated, optimised, optimized, reduced, scaled, deployed, instrumented
    - debugged, refactored, integrated, benchmarked, evaluated, profiled
    - developed, created, engineered, delivered, launched, maintained

