name: ci

on:
  push: {branches: [main]}
  pull_request:

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: ./v1/scripts/scan_secrets.sh

  v1:
    name: v1 tests (offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev]"
      - name: pytest
        # Every test runs offline against fakes. Dummy keys are deliberate:
        # if a test needs a real credential, that test is wrong.
        env:
          GROQ_API_KEY: test-dummy
          TYPESAFE_API_KEY: test-dummy
          LANGSMITH_API_KEY: test-dummy
          LANGSMITH_TRACING: "false"
          GITHUB_PERSONAL_ACCESS_TOKEN: test-dummy
        run: pytest
      - run: ruff check src tests evals scripts app.py

  v2:
    name: v2 tests (offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev]"
      - name: pytest
        env:
          GROQ_API_KEY: test-dummy
          TYPESAFE_API_KEY: test-dummy
          LANGSMITH_API_KEY: test-dummy
          LANGSMITH_TRACING: "false"
          GITHUB_PERSONAL_ACCESS_TOKEN: test-dummy
        run: pytest
      - run: ruff check src tests
