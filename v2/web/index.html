<html lang="en">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="/css/tokens.css">

<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Resume Simulator</h1>
      <p class="sub">Your resume is the baseline and is never rewritten.
      Every number below is measured, not estimated — and anything that cannot
      be traced to evidence is left as a blank for you to fill.</p>
    </div>
    <div class="row">
      <button class="btn" id="themeBtn" type="button">Theme</button>
    </div>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="view"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
