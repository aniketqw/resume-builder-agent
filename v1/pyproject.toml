[project]
name = "resume-builder-agent"
version = "0.1.0"
description = "Evidence-grounded resume builder: GitHub repos -> verified claims -> role resumes -> improvement plan"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2.18",
  "langgraph-checkpoint-sqlite>=3.1.2",
  "langchain-groq>=1.1.3",
  "langchain-core>=1.4.0",
  "langsmith>=0.14.14",
  "pydantic>=2.7",
  "httpx>=0.27",
  "tenacity>=9.0",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "aiosqlite>=0.20",
  # Scoring core. numpy and rank-bm25 are pure/portable; onnxruntime runs the
  # embedding model WITHOUT torch -- sentence-transformers would pull ~1GB and
  # blow Streamlit Community Cloud's 690MB guaranteed floor.
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
  "onnxruntime>=1.17",
  "tokenizers>=0.15",
  "streamlit>=1.40",
  # MCP is the default GitHub backend, not an optional extra.
  "langchain[mcp]>=1.0",
  "pypdf>=6.21.4",
  "fpdf2>=2.8.9",
]

[project.optional-dependencies]
# `markdown` renders the Hugging Face static page in scripts/build_site.py.
# It was installed ad-hoc and silently dropped on the next sync, which
# broke the deploy workflow's staleness check.
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "markdown>=3.5"]

[project.scripts]
rba = "rba.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rba"]

[tool.pytest.ini_options]
# "." as well as "src": tests/test_merge.py imports `app`, which lives at the
# project root. Under `python -m pytest` the cwd is on sys.path and it
# resolved by luck; under the `pytest` console script -- which is how CI
# invokes it -- it did not, so that test had been failing on main.
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
  "slow: touches the embedding model; timing-sensitive",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = [
  "E501",    # long lines are handled by the formatter, not an error
  "B008",    # typer uses Option() in defaults by design
]

[tool.ruff.lint.isort]
# `fakes` and `conftest` are test-local modules, not third-party packages.
known-first-party = ["rba", "fakes", "run_trace", "judge"]

[tool.ruff.lint.per-file-ignores]
# `doctor` is a diagnostic: it must report any provider failure, not raise.
"src/rba/cli.py" = ["BLE001"]
# importorskip must run before the modules it guards are imported.
"tests/*" = ["RUF059", "E402"]
